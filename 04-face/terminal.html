<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CENTRAL dumb terminal (test page — not deployed)</title>
<style>
  body { background:#000; color:#0f0; font-family: monospace; margin:0; padding:0; }
  #log { white-space: pre-wrap; word-break: break-all; padding: 8px; height: 90vh; overflow-y: auto; box-sizing: border-box; }
  #bar { display:flex; gap:4px; padding:4px; }
  #inp { flex:1; background:#111; color:#0f0; border:1px solid #0f0; font-family: monospace; padding:6px; }
  button { background:#111; color:#0f0; border:1px solid #0f0; padding:6px 12px; cursor:pointer; }
  .line { border-bottom: 1px solid #033; padding: 2px 0; }
</style>
</head>
<body>
<div id="log"></div>
<div id="bar">
  <input id="inp" autocomplete="off" placeholder="type a message, press Enter or Send" />
  <button id="send">Send</button>
</div>
<script>
  const log = document.getElementById('log');
  const inp = document.getElementById('inp');
  const btn = document.getElementById('send');

  function appendLine(text) {
    const div = document.createElement('div');
    div.className = 'line';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  appendLine('[client] connecting to ws://localhost:8791 ...');
  const ws = new WebSocket('ws://localhost:8791');

  ws.addEventListener('open', () => appendLine('[client] WS OPEN'));
  ws.addEventListener('close', () => appendLine('[client] WS CLOSED'));
  ws.addEventListener('error', (e) => appendLine('[client] WS ERROR ' + e));

  ws.addEventListener('message', (msg) => {
    // Deliberately dumb: show raw JSON, plus a minimally-parsed 'type: text' line
    // when it's a result/ready/tool event, for readability. No further formatting.
    let raw = msg.data;
    appendLine('[raw] ' + raw);
    try {
      const obj = JSON.parse(raw);
      if (obj.kind === 'result') appendLine('  >> result: ' + JSON.stringify(obj.result));
      if (obj.kind === 'ready') appendLine('  >> ready: session=' + obj.sessionId + ' pid=' + obj.pid);
      if (obj.kind === 'tool') appendLine('  >> tool: ' + obj.name);
      if (obj.kind === 'exit') appendLine('  >> exit: code=' + obj.exitCode);
    } catch (e) { /* not JSON, raw line above is enough */ }
  });

  function sendCurrent() {
    const text = inp.value;
    if (!text) return;
    ws.send(text);
    appendLine('[sent] ' + text);
    inp.value = '';
  }

  btn.addEventListener('click', sendCurrent);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCurrent(); });
</script>
</body>
</html>
